services:
  - type: web
    name: facturation-audit
    runtime: node
    buildCommand: npm install && npm run build:all
    startCommand: NODE_ENV=production npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: SERAMAR_MONGODB_URI
        sync: false
      - key: PORT
        value: 10000
